<svg viewBox="0 0 620 360" role="img" aria-label="How one authorization request moves through Pavo Cloud">
  <style>
    .bx   { fill:#fff; stroke:#8f8f8f; stroke-width:1; }
    .gate { fill:#F2F7FC; stroke:#1274C4; stroke-width:1.8; }
    .num  { font:bold 9.5px "Times New Roman",Times,serif; fill:#1274C4; }
    .tl   { font:bold 9.5px "Times New Roman",Times,serif; fill:#000; }
    .tx   { font:8.7px "Times New Roman",Times,serif; fill:#333; }
    .hd   { font:bold 8.5px "Times New Roman",Times,serif; fill:#1274C4; letter-spacing:.08em; }
    .ar   { stroke:#777; stroke-width:1.1; fill:none; marker-end:url(#a); }
    .arb  { stroke:#1274C4; stroke-width:1.5; fill:none; marker-end:url(#ab); }
    .lb   { font:italic 8.4px "Times New Roman",Times,serif; fill:#555; }
    .ol   { font:bold 9.5px "Times New Roman",Times,serif; fill:#1274C4; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#777"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1274C4"/>
    </marker>
  </defs>

  <!-- ===================== lane headers ===================== -->
  <text x="0"   y="9" class="hd">THE DOCTOR'S SIDE</text>
  <text x="205" y="9" class="hd">THE INSURER'S SIDE</text>
  <text x="424" y="9" class="hd">THE PERMANENT RECORD</text>
  <line x1="0"   y1="13" x2="185" y2="13" stroke="#1274C4" stroke-width="1"/>
  <line x1="205" y1="13" x2="390" y2="13" stroke="#1274C4" stroke-width="1"/>
  <line x1="424" y1="13" x2="620" y2="13" stroke="#1274C4" stroke-width="1"/>

  <!-- ===================== left lane ===================== -->
  <rect x="0" y="22" width="185" height="38" class="bx"/>
  <text x="8"  y="35" class="num">1</text>
  <text x="19" y="35" class="tl">The order is placed</text>
  <text x="19" y="47" class="tx">A doctor enters the procedure</text>
  <text x="19" y="56" class="tx">and the diagnosis into the chart.</text>

  <rect x="0" y="70" width="185" height="47" class="bx"/>
  <text x="8"  y="83" class="num">2</text>
  <text x="19" y="83" class="tl">The name is removed</text>
  <text x="19" y="95" class="tx">The patient identifier becomes a</text>
  <text x="19" y="104" class="tx">scrambled code. The real one is</text>
  <text x="19" y="113" class="tx">never stored or sent.</text>

  <rect x="0" y="127" width="185" height="47" class="bx"/>
  <text x="8"  y="140" class="num">3</text>
  <text x="19" y="140" class="tl">The request is packaged</text>
  <text x="19" y="152" class="tx">Medical details go into FHIR, the</text>
  <text x="19" y="161" class="tx">standard format insurers are</text>
  <text x="19" y="170" class="tx">already required to accept.</text>

  <rect x="0" y="184" width="185" height="38" class="bx"/>
  <text x="8"  y="197" class="num">4</text>
  <text x="19" y="197" class="tl">It is signed</text>
  <text x="19" y="209" class="tx">A digital signature proves who</text>
  <text x="19" y="218" class="tx">sent it, and that nothing changed.</text>

  <path class="ar" d="M92,60 L92,68"/>
  <path class="ar" d="M92,117 L92,125"/>
  <path class="ar" d="M92,174 L92,182"/>

  <!-- the one path that crosses between two organisations -->
  <path class="arb" d="M185,203 L195,203 L195,45 L203,45"/>

  <!-- ===================== middle lane ===================== -->
  <rect x="205" y="22" width="185" height="47" class="gate"/>
  <text x="213" y="35" class="num">5</text>
  <text x="224" y="35" class="tl">The signature is checked</text>
  <text x="224" y="47" class="tx">If it fails the request is refused</text>
  <text x="224" y="56" class="tx">and the refusal logged. Nothing</text>
  <text x="224" y="65" class="tx">else happens: it is never read.</text>

  <rect x="205" y="80" width="185" height="47" class="bx"/>
  <text x="213" y="93" class="num">6</text>
  <text x="224" y="93" class="tl">The rules are applied</text>
  <text x="224" y="105" class="tx">The request is checked against</text>
  <text x="224" y="114" class="tx">the insurer's published coverage</text>
  <text x="224" y="123" class="tx">rules. First match decides.</text>

  <rect x="205" y="138" width="185" height="38" class="bx"/>
  <text x="213" y="151" class="num">7</text>
  <text x="224" y="151" class="tl">A decision comes out</text>
  <text x="224" y="163" class="tx">It always names the exact rule</text>
  <text x="224" y="172" class="tx">that produced it.</text>

  <path class="ar" d="M297,69 L297,78"/>
  <path class="ar" d="M297,127 L297,136"/>

  <!-- ===================== right lane ===================== -->
  <rect x="424" y="22" width="196" height="86" class="bx"/>
  <text x="432" y="35" class="tl">The audit trail</text>
  <text x="432" y="47" class="tx">Five time-stamped entries are written</text>
  <text x="432" y="56" class="tx">for every request: created, sent,</text>
  <text x="432" y="65" class="tx">received, decided, answered. Each</text>
  <text x="432" y="74" class="tx">decision records the exact rule that</text>
  <text x="432" y="83" class="tx">produced it, and what changed.</text>
  <text x="432" y="97" class="tx">Written whether or not a person is</text>
  <text x="432" y="106" class="tx">ever involved.</text>

  <rect x="424" y="118" width="196" height="62" class="bx"/>
  <text x="432" y="131" class="tl">Nothing can be edited</text>
  <text x="432" y="143" class="tx">Entries can only be added, never</text>
  <text x="432" y="152" class="tx">changed or deleted, so a regulator</text>
  <text x="432" y="161" class="tx">can reconstruct exactly what</text>
  <text x="432" y="170" class="tx">happened, and why, months later.</text>

  <path class="ar" d="M390,45 L422,45"/>
  <path class="ar" d="M390,157 L422,157"/>

  <!-- ===================== the three outcomes ===================== -->
  <path d="M297,176 L297,238" stroke="#1274C4" stroke-width="1.5" fill="none"/>
  <line x1="92" y1="238" x2="522" y2="238" stroke="#1274C4" stroke-width="1.5"/>
  <path class="arb" d="M92,238 L92,256"/>
  <path class="arb" d="M297,238 L297,256"/>
  <path class="arb" d="M522,238 L522,256"/>

  <rect x="0" y="258" width="185" height="54" class="bx"/>
  <text x="8" y="272" class="ol">Approved</text>
  <text x="8" y="285" class="tx">Written straight back into the</text>
  <text x="8" y="294" class="tx">patient's chart. No person is</text>
  <text x="8" y="303" class="tx">involved at any point.</text>

  <rect x="205" y="258" width="185" height="54" class="bx"/>
  <text x="213" y="272" class="ol">Unclear</text>
  <text x="213" y="285" class="tx">Sent to a human reviewer with</text>
  <text x="213" y="294" class="tx">the whole file assembled. It is</text>
  <text x="213" y="303" class="tx">never guessed at.</text>

  <rect x="424" y="258" width="196" height="54" class="bx"/>
  <text x="432" y="272" class="ol">Denied</text>
  <text x="432" y="285" class="tx">Appealed automatically, or sent to</text>
  <text x="432" y="294" class="tx">a person. The software cannot</text>
  <text x="432" y="303" class="tx">issue a final denial by itself.</text>

  <!-- ===================== footer note ===================== -->
  <line x1="0" y1="330" x2="620" y2="330" stroke="#c9c9c9" stroke-width="1"/>
  <text x="0" y="343" class="lb">Typical time from step 1 to step 7: <tspan font-style="normal" font-weight="bold" fill="#000">89.2 milliseconds</tspan>, measured over fifty consecutive runs.</text>
  <text x="0" y="355" class="lb">The blue path is the only one that crosses between two organisations.</text>
</svg>
