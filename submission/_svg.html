<svg viewBox="0 0 620 352" role="img" aria-label="How one authorization request moves through Pavo Cloud">
  <style>
    .bx   { fill:#fff; stroke:#9a9a9a; stroke-width:1; }
    .gate { fill:#F2F7FC; stroke:#1274C4; stroke-width:1.8; }
    .out  { fill:#fff; stroke:#9a9a9a; stroke-width:1; }
    .num  { font:bold 9px "Times New Roman",Times,serif; fill:#1274C4; }
    .tl   { font:bold 9.5px "Times New Roman",Times,serif; fill:#000; }
    .tx   { font:8.6px "Times New Roman",Times,serif; fill:#333; }
    .hd   { font:bold 8.5px "Times New Roman",Times,serif; fill:#1274C4; letter-spacing:.08em; }
    .ar   { stroke:#555; stroke-width:1.1; fill:none; marker-end:url(#a); }
    .arb  { stroke:#1274C4; stroke-width:1.4; fill:none; marker-end:url(#ab); }
    .lb   { font:italic 8.2px "Times New Roman",Times,serif; fill:#555; }
    .ol   { font:bold 9.5px "Times New Roman",Times,serif; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1274C4"/>
    </marker>
  </defs>

  <!-- ============ lane headers ============ -->
  <text x="0"   y="9" class="hd">THE DOCTOR'S SIDE</text>
  <text x="205" y="9" class="hd">THE INSURER'S SIDE</text>
  <text x="424" y="9" class="hd">THE PERMANENT RECORD</text>
  <line x1="0"   y1="13" x2="185" y2="13" stroke="#1274C4" stroke-width="1"/>
  <line x1="205" y1="13" x2="390" y2="13" stroke="#1274C4" stroke-width="1"/>
  <line x1="424" y1="13" x2="620" y2="13" stroke="#1274C4" stroke-width="1"/>

  <!-- ============ left lane: the doctor's side ============ -->
  <rect x="0" y="22" width="185" height="38" class="bx"/>
  <text x="7"  y="35" class="num">1</text>
  <text x="18" y="35" class="tl">The order is placed</text>
  <text x="18" y="47" class="tx">A doctor enters the procedure</text>
  <text x="18" y="56" class="tx">and the diagnosis into the chart.</text>

  <rect x="0" y="68" width="185" height="47" class="bx"/>
  <text x="7"  y="81" class="num">2</text>
  <text x="18" y="81" class="tl">The name is removed</text>
  <text x="18" y="93" class="tx">The patient identifier is replaced</text>
  <text x="18" y="102" class="tx">by a scrambled code. The real one</text>
  <text x="18" y="111" class="tx">is never stored or sent.</text>

  <rect x="0" y="123" width="185" height="47" class="bx"/>
  <text x="7"  y="136" class="num">3</text>
  <text x="18" y="136" class="tl">The request is packaged</text>
  <text x="18" y="148" class="tx">Medical details go into FHIR, the</text>
  <text x="18" y="157" class="tx">standard format insurers are</text>
  <text x="18" y="166" class="tx">already required to accept.</text>

  <rect x="0" y="178" width="185" height="38" class="bx"/>
  <text x="7"  y="191" class="num">4</text>
  <text x="18" y="191" class="tl">It is signed</text>
  <text x="18" y="203" class="tx">A digital signature proves who sent</text>
  <text x="18" y="212" class="tx">it and that nothing was changed.</text>

  <path class="ar" d="M92,60 L92,66"/>
  <path class="ar" d="M92,115 L92,121"/>
  <path class="ar" d="M92,170 L92,176"/>

  <!-- hand-off between organisations -->
  <path class="arb" d="M185,197 C196,197 194,44 203,44"/>

  <!-- ============ middle lane: the insurer's side ============ -->
  <rect x="205" y="22" width="185" height="47" class="gate"/>
  <text x="212" y="35" class="num">5</text>
  <text x="223" y="35" class="tl">The signature is checked</text>
  <text x="223" y="47" class="tx">If it fails, the request is refused and</text>
  <text x="223" y="56" class="tx">the refusal is logged. Nothing else</text>
  <text x="223" y="65" class="tx">happens &mdash; it is never even read.</text>

  <rect x="205" y="80" width="185" height="47" class="bx"/>
  <text x="212" y="93" class="num">6</text>
  <text x="223" y="93" class="tl">The rules are applied</text>
  <text x="223" y="105" class="tx">The request is checked against the</text>
  <text x="223" y="114" class="tx">insurer's published coverage rules.</text>
  <text x="223" y="123" class="tx">The first rule that matches decides.</text>

  <rect x="205" y="138" width="185" height="38" class="bx"/>
  <text x="212" y="151" class="num">7</text>
  <text x="223" y="151" class="tl">A decision comes out</text>
  <text x="223" y="163" class="tx">It always names the exact rule that</text>
  <text x="223" y="172" class="tx">produced it.</text>

  <path class="ar" d="M297,69 L297,78"/>
  <path class="ar" d="M297,127 L297,136"/>

  <!-- ============ right lane: the record ============ -->
  <rect x="424" y="22" width="196" height="59" class="bx"/>
  <text x="431" y="35" class="tl">The audit trail</text>
  <text x="431" y="47" class="tx">Five time-stamped entries are written</text>
  <text x="431" y="56" class="tx">for every request. Each decision</text>
  <text x="431" y="65" class="tx">records the exact rule behind it, and</text>
  <text x="431" y="74" class="tx">what changed.</text>

  <rect x="424" y="92" width="196" height="47" class="bx"/>
  <text x="431" y="105" class="tl">Nothing can be edited</text>
  <text x="431" y="117" class="tx">Entries can only be added, never</text>
  <text x="431" y="126" class="tx">changed, so a regulator can see</text>
  <text x="431" y="135" class="tx">exactly what happened and why.</text>

  <path class="ar" d="M390,50 L422,46"/>
  <path class="ar" d="M390,157 L422,116"/>

  <!-- ============ the three outcomes ============ -->
  <path d="M297,176 L297,232" stroke="#1274C4" stroke-width="1.4" fill="none"/>
  <line x1="92" y1="232" x2="522" y2="232" stroke="#1274C4" stroke-width="1.4"/>
  <path class="arb" d="M92,232 L92,250"/>
  <path class="arb" d="M297,232 L297,250"/>
  <path class="arb" d="M522,232 L522,250"/>

  <rect x="0"   y="252" width="185" height="52" class="out"/>
  <text x="7" y="266" class="ol" fill="#1274C4">Approved</text>
  <text x="7" y="279" class="tx">Written straight back into the</text>
  <text x="7" y="288" class="tx">patient's chart. No person is</text>
  <text x="7" y="297" class="tx">involved at any point.</text>

  <rect x="205" y="252" width="185" height="52" class="out"/>
  <text x="212" y="266" class="ol" fill="#1274C4">Unclear</text>
  <text x="212" y="279" class="tx">Sent to a human reviewer with</text>
  <text x="212" y="288" class="tx">the whole file already</text>
  <text x="212" y="297" class="tx">assembled. Never guessed at.</text>

  <rect x="424" y="252" width="196" height="52" class="out"/>
  <text x="431" y="266" class="ol" fill="#1274C4">Denied</text>
  <text x="431" y="279" class="tx">Appealed automatically, or sent</text>
  <text x="431" y="288" class="tx">to a person. The software cannot</text>
  <text x="431" y="297" class="tx">issue a final denial by itself.</text>

  <!-- ============ footer note ============ -->
  <line x1="0" y1="322" x2="620" y2="322" stroke="#c9c9c9" stroke-width="1"/>
  <text x="0" y="335" class="lb">Typical time from step 1 to step 7: <tspan font-style="normal" font-weight="bold" fill="#000">88.6 milliseconds</tspan>, measured over twenty consecutive runs. No person</text>
  <text x="0" y="347" class="lb">touches any of the seven steps. The blue path is the only one that crosses between two organisations.</text>
</svg>
